name: Release Desktop Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg --no-sign
          - os: macos-latest
            label: macos-x64
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg --no-sign
          - os: windows-latest
            label: windows-x64
            rust_target: native
            args: --bundles nsis,msi --no-sign
          - os: ubuntu-22.04
            label: linux-x64
            rust_target: native
            args: --bundles appimage,deb --no-sign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != 'native'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PDF to Calendar ${{ github.ref_name }}
          releaseBody: |
            Automated release bundles for macOS, Windows, and Linux.
            Generated by GitHub Actions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
